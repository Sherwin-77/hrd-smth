services:
  db:
    image: postgres:18-alpine
    container_name: app_database
    env_file:
      - backend/.env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d hrd']
      interval: 5s
      timeout: 5s
      retries: 5

  migration:
    build:
      context: ./backend
    container_name: app_migration
    command: >
      sh -c "
        echo 'Running migrations...' &&
        npm run migrate:up
      "
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - backend/.env

  backend:
    build:
      context: ./backend
    container_name: app_backend
    ports:
      - "3001:3001"
    depends_on:
      migration:
        condition: service_completed_successfully
    env_file:
      - backend/.env

  frontend:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:3001 
    container_name: app_frontend
    ports:
      - "3000:3000"
    environment:
      - INTERNAL_API_URL=http://backend:3001
    depends_on:
      - backend

volumes:
  pgdata: